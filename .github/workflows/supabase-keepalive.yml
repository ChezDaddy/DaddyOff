name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 */6 * * *'  # toutes les 6h — large marge sous le seuil de mise en pause (7 jours)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DaddyOff
        run: |
          curl -s -o /dev/null -w "DaddyOff: %{http_code}\n" \
            "https://rthuuubrvitkbeskwgay.supabase.co/rest/v1/app_users?select=id&limit=1" \
            -H "apikey: ${{ secrets.DADDYOFF_ANON_KEY }}"
